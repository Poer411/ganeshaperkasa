<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ganesha Perkasa</title>
    <style>
        /* Mengatur tampilan dasar halaman */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        /* Mengatur kotak konten utama */
        .container {
            text-align: center;
            background-color: #ffffff;
            padding: 40px 60px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            max-width: 450px;
            width: 100%;
        }

        /* Mengatur gaya teks judul */
        h1 {
            color: #1e3a8a;
            margin-bottom: 10px;
            font-size: 2.2rem;
        }

        /* Mengatur gaya teks deskripsi */
        p {
            color: #666;
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        /* Mengatur gaya tombol interaktif */
        .btn {
            display: inline-block;
            text-decoration: none;
            background-color: #2563eb;
            color: white;
            padding: 12px 30px;
            border-radius: 6px;
            font-weight: 600;
            transition: background-color 0.3s ease;
        }

        /* Efek saat tombol diarahkan kursor (hover) */
        .btn:hover {
            background-color: #1d4ed8;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Selamat datang</h1>
        <p>Terima kasih telah mengunjungi <strong>ganeshaperkasa.web.id</strong>. Halaman ini sedang dalam proses pengembangan.</p>
        <a href="mailto:info@ganeshaperkasa.web.id" class="btn">Hubungi Kami</a>
    </div>

</body>
</html>
